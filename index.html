<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Targets">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Weekly Targets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone app, scoreboard numbers, bottom tab bar (This week / review) */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#141A2B; --muted:#5B6478; --line:#D7DCE6;
  --accent:#2B54D6; --accent-ink:#FFFFFF; --accent-soft:#DCE4FB;
  --warn:#A86B12; --bad:#C0413A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0F18; --surface:#151A27; --ink:#E7EBF4; --muted:#949CB0; --line:#262D3E;
  --accent:#7D9BFF; --accent-ink:#0A0F1F; --accent-soft:#1D2848;
  --warn:#E3A94B; --bad:#EE6A61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F18; --surface:#151A27; --ink:#E7EBF4; --muted:#949CB0; --line:#262D3E;
  --accent:#7D9BFF; --accent-ink:#0A0F1F; --accent-soft:#1D2848;
  --warn:#E3A94B; --bad:#EE6A61; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
[hidden]{display:none!important}
.stack{display:flex;flex-direction:column;gap:8px}
.stack label{font-size:14px;font-weight:600}
.stack .btn{margin-top:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=url],input[type=text]{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:16px;width:100%}
.btn{height:44px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 16px;white-space:nowrap}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}

/* week header */
.weekhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weekhead h1{font-size:34px;line-height:1}
.arrow{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;display:grid;place-items:center}
.arrow:disabled{opacity:.3;cursor:default}
.score{display:flex;align-items:flex-end;gap:12px}
.score .big{font-size:64px;line-height:.85;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .3s}

/* goal + habit */
.goal{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.goal-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.goal-head h2{font-size:24px}
.goal-head .num{font-size:24px;font-weight:700}
.habit{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;padding-top:14px;border-top:1px solid var(--line)}
.habit-main{min-width:0;display:flex;flex-direction:column;gap:8px}
.h-top{display:flex;align-items:baseline;gap:8px}
.h-name{font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere}
.h-count{font-size:22px;font-weight:700}
.h-count small{font-size:15px;color:var(--muted);font-weight:600}
.h-pct{font-size:15px;color:var(--muted);min-width:3.2em;text-align:right}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:12px;font-weight:600;color:var(--muted);padding:0}
.day.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.today{border-color:var(--ink);color:var(--ink)}
.day.today.done{color:var(--accent-ink)}
.day:disabled{opacity:.35;cursor:default}
.hint{font-size:14px;color:var(--muted)}
.hint.ok{color:var(--accent)} .hint.warn{color:var(--warn)} .hint.bad{color:var(--bad)}
.check{grid-row:1;grid-column:2;width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);
  display:grid;place-items:center;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;line-height:1.1;text-align:center;transition:transform .1s}
.check:active{transform:scale(.94)}
.check svg{width:26px;height:26px}
.check.on{background:var(--accent);color:var(--accent-ink)}

/* review */
.block{background:var(--surface);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.block-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.block-head h2{font-size:24px}
.block-head .big{font-size:44px;font-weight:700;line-height:.9}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.past{background:var(--line);color:var(--muted)}
.insights{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.insight{border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.insight b{display:block;font-size:15px;overflow-wrap:anywhere}
.insight.good .label{color:var(--accent)} .insight.improve .label{color:var(--bad)}
.r-goal{display:flex;justify-content:space-between;font-family:var(--display);font-size:19px;font-weight:600;padding-top:10px;border-top:1px solid var(--line)}
.r-habit{display:flex;flex-direction:column;gap:6px}
.r-top{display:flex;align-items:baseline;gap:8px}
.r-top .h-name{font-weight:500}
.r-top .num{font-size:20px;font-weight:700}
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.wk{border-radius:8px;padding:4px 0;text-align:center;font-size:14px;background:color-mix(in srgb,var(--accent) var(--fill,0%),var(--bg))}
.wk.full{color:var(--accent-ink)}
.wk small{display:block;font-size:10px;letter-spacing:.06em;color:inherit;opacity:.75}
.wk.na{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.diff{font-size:14px;color:var(--muted)}
.diff .neg{color:var(--bad);font-weight:600} .diff .pos{color:var(--accent);font-weight:600}

.pvd{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.pvd th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 0 6px 10px}
.pvd th:first-child{text-align:left;padding-left:0}
.pvd td{padding:8px 0 8px 10px;text-align:right;border-top:1px solid var(--line)}
.pvd td:first-child{text-align:left;padding-left:0;overflow-wrap:anywhere}
.pvd .g-row th,.pvd .g-row td{font-family:var(--display);font-size:19px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;padding-top:18px}
.pvd .g-row th{text-align:left;padding-left:0;border-top:1px solid var(--line)}
.pvd .neg{color:var(--bad)} .pvd .pos{color:var(--accent)}
.pvd .sub{display:block;font-size:12px;color:var(--muted)}
.pvd .st{font-weight:600;white-space:nowrap}
.pvd .st.neg{color:var(--bad)} .pvd .st.pos{color:var(--accent)}
.insights.one{grid-template-columns:1fr}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.improve .chip{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.pvd .st{text-align:center}
/* this week: goal = umbrella title, tasks = compact rows */
.goal-group{display:flex;flex-direction:column;gap:8px}
.goal-title{font-size:26px;line-height:1.1;padding-inline:2px}
.tasks{background:var(--surface);border-radius:14px;padding:2px 14px}
.task{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task-main{min-width:0;display:flex;flex-direction:column;gap:6px}
.t-top{display:flex;align-items:baseline;gap:8px}
.t-name{flex:1;min-width:0;font-size:15px;font-weight:500;overflow-wrap:anywhere}
.t-score{font-size:14px;color:var(--muted);white-space:nowrap}
.t-score b{font-size:17px;color:var(--ink)}
.t-pct{display:inline-block;min-width:3.4em;text-align:right;margin-left:4px;font-weight:600;color:var(--ink)}
.task.hit .t-pct{color:var(--accent)}
.task .day{height:22px;font-size:10px;border-radius:6px}
.task .check{grid-row:auto;grid-column:auto;width:40px;height:40px;border-width:2px}
.task .check svg{width:20px;height:20px}
/* tab bar + toast */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .tabs{display:grid;grid-template-columns:repeat(2,1fr);width:100%;max-width:560px}
nav button{background:none;border:0;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>

<nav><div class="tabs">
  <button id="tab-week" data-tab="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>This week</button>
  <button id="tab-review" data-tab="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>8-week review</button>
</div></nav>
<div id="toast" hidden></div>

<script>
/* ---------- 1. Small date helpers ---------- */
const DAY = 864e5;
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const LETTERS = ['M','T','W','T','F','S','S'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => { const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; };
const weeksBetween = (a,b) => Math.round((b-a)/(7*DAY));
const today = () => { const n = new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); };
function isoWeek(d){
  const t = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  t.setUTCDate(t.getUTCDate()+4-(t.getUTCDay()||7));
  return Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/DAY+1)/7);
}
function rangeLabel(start, days){
  const end = addDays(start, days-1);
  return start.getMonth()===end.getMonth()
    ? `${start.getDate()}–${end.getDate()} ${MONTHS[end.getMonth()]}`
    : `${start.getDate()} ${MONTHS[start.getMonth()]} – ${end.getDate()} ${MONTHS[end.getMonth()]}`;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 2. Connection to your Google Sheet (saved on this phone only) ---------- */
const conn = {
  url: 'https://script.google.com/macros/s/AKfycby7qjQ5y6ve2310oxI9OjK5xqWQgXISorgihZdl_b9x_WhY-SKPoyfJDu7b9oLfFxz6ZQ/exec',
  key: 'b380313a0f54',
};

async function api(method, body){
  const res = method === 'GET'
    ? await fetch(`${conn.url}?key=${encodeURIComponent(conn.key)}`)
    // text/plain keeps this a "simple" request, so the browser doesn't block it (CORS)
    : await fetch(conn.url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({ key:conn.key, ...body }) });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

/* ---------- 3. State: everything comes from the sheet ---------- */
// Your plan (also in the "Plan" tab of the sheet; the sheet wins when it can be reached)
const PLAN = [
  ['5 kg lighter','gym','Gym',4], ['5 kg lighter','running','Running',3], ['5 kg lighter','no-sugar','No sugar',5], ['5 kg lighter','football','Football',1],
  ['Healthier','no-smoking','No smoking',7], ['Healthier','stretching','Stretching',5], ['Healthier','water','Drink 3 L of water',7],
  ['Ready for interviews','question','Practice one interview question',3], ['Ready for interviews','study','Study for 1 h',4],
  ['Ready for interviews','listening','Listening practice, 15 min',7], ['Ready for interviews','speaking','Speaking practice, 15 min',7],
  ['Ready for interviews','topic','Learn and explain 1 topic',3],
].map(([goal,id,name,target]) => ({ goal, id, name, target }));
const state = { goals:[], habits:[], checkins:new Set(), start:'2026-10-19', weeks:8 };
function setPlan(plan){
  state.goals = [...new Set(plan.map(p => p.goal))].map(name => ({ id:name, name }));
  state.habits = plan.map(p => ({ id:p.id, goalId:p.goal, name:p.name, target:Math.max(1, Math.min(7, p.target)) }));
}
setPlan(PLAN);
const ui = { tab:'week', weekOffset:0 };
try { ui.tab = localStorage.getItem('wt-tab') || 'week'; } catch(e){}
if(ui.tab !== 'review') ui.tab = 'week';

const key = (habitId, date) => `${habitId}_${date}`;
const isDone = (habitId, date) => state.checkins.has(key(habitId, date));
const habitsOf = goalId => state.habits.filter(h => h.goalId === goalId);
const doneInWeek = (h, ws) => { let n=0; for(let i=0;i<7;i++) if(isDone(h.id, ymd(addDays(ws,i)))) n++; return n; };
const pct = (done, target) => target ? Math.round(Math.min(done,target)/target*100) : 0;

async function load(){
  try {
    const data = await api('GET');
    if(data.plan.length) setPlan(data.plan);
    state.checkins = new Set(data.checkins.map(c => key(c.habitId, c.date)));
    if(/^\d{4}-\d{2}-\d{2}$/.test(data.settings.start)) state.start = ymd(mondayOf(parse(data.settings.start)));
    state.weeks = data.settings.weeks || 8;
    render();
  } catch(e) {
    // The screen keeps working with the plan above; only the sheet sync is missing
  }
}

async function toggle(habitId, date){
  const h = state.habits.find(x => x.id === habitId);
  const k = key(habitId, date), done = !state.checkins.has(k);
  done ? state.checkins.add(k) : state.checkins.delete(k);   // update the screen first...
  render();
  try {
    await api('POST', { habitId, date, done, habit:h?.name, goal:h?.goalId, week:isoWeek(parse(date)) });
  } catch(e) {
    toast("Not saved to your sheet. Check your internet and tap again.");
  }
}

/* ---------- 4. Screens ---------- */
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function renderWeek(){
  const ws = addDays(mondayOf(today()), ui.weekOffset*7);
  const isCurrent = ui.weekOffset===0, t = ymd(today());
  const goalsHtml = state.goals.map(g => {
    const hs = habitsOf(g.id); if(!hs.length) return '';
    const rows = hs.map(h => {
      const done = doneInWeek(h, ws), p = pct(done, h.target), onToday = isDone(h.id, t);
      const days = LETTERS.map((L,i) => {
        const d = ymd(addDays(ws,i)), on = isDone(h.id,d);
        return `<button class="day${on?' done':''}${d===t?' today':''}" data-act="toggle" data-h="${esc(h.id)}" data-d="${d}" ${d>t?'disabled':''} aria-label="${L} ${d}" aria-pressed="${on}">${L}</button>`;
      }).join('');
      return `<div class="task${done>=h.target?' hit':''}">
        <div class="task-main">
          <div class="t-top"><span class="t-name">${esc(h.name)}</span><span class="t-score num"><b>${done}</b>/${h.target}<span class="t-pct">${p}%</span></span></div>
          <div class="days">${days}</div>
        </div>
        ${isCurrent ? `<button class="check${onToday?' on':''}" data-act="toggle" data-h="${esc(h.id)}" data-d="${t}" aria-pressed="${onToday}" aria-label="${esc(h.name)} done today">${CHECK}</button>` : ''}
      </div>`;
    }).join('');
    return `<section class="goal-group"><h2 class="goal-title">${esc(g.name)}</h2><div class="tasks">${rows}</div></section>`;
  }).join('');
  return `
    <header class="weekhead">
      <button class="arrow" data-act="prev" aria-label="Previous week" ${ws<=parse(state.start)?'disabled':''}>‹</button>
      <div style="text-align:center"><h1>${isCurrent?'This week':'Week '+isoWeek(ws)}</h1><p class="muted" style="margin:4px 0 0">Week ${isoWeek(ws)} · ${rangeLabel(ws,7)}</p></div>
      <button class="arrow" data-act="next" aria-label="Next week" ${isCurrent?'disabled':''}>›</button>
    </header>
    <p class="label" style="margin:4px 2px -4px">In ${state.weeks || BLOCK} weeks, I'll be…</p>
    ${goalsHtml}`;
}

/* Expected so far = weekly target spread over the days that have passed (today counts only after it ends) */
function habitStatus(done, expected){
  const d = done - expected;
  if(d > 0) return { cls:'pos', text:`+${d}`, ok:true };
  if(d === 0) return { cls:'pos', text:'✓', ok:true };
  return { cls:'neg', text:`−${-d}`, ok:false };
}

function renderReview(){
  const B = state.weeks || BLOCK, start = parse(state.start), t = today(), nowW = mondayOf(t);
  if(nowW < start) return `<section class="empty"><h2>Your plan starts on ${rangeLabel(start,1)}</h2></section>`;
  const current = Math.floor(weeksBetween(start, nowW)/B);
  let html = `<header><p class="label">${B}-week review</p><h1 style="font-size:34px">How am I doing?</h1></header>`;
  for(let n=current; n>=0; n--){
    const bs = addDays(start, n*B*7), isCur = n===current;
    const weeksIn = isCur ? weeksBetween(bs, nowW)+1 : B;
    const daysPassed = isCur ? Math.round((t - bs)/DAY) : B*7;
    const all = [];
    let body = '';
    state.goals.forEach(g => {
      const hs = habitsOf(g.id); if(!hs.length) return;
      let ge=0, gd=0;
      const rows = hs.map(h => {
        let done = 0; for(let w=0; w<weeksIn; w++) done += doneInWeek(h, addDays(bs, w*7));
        const expected = Math.round(h.target * daysPassed / 7);
        const s = habitStatus(done, expected); all.push({ h, s });
        ge += expected; gd += done;
        return `<tr><td>${esc(h.name)}<span class="sub">${h.target}×/wk · ${h.target*B} in total</span></td><td class="num">${expected}</td><td class="num">${done}</td><td class="st ${s.cls}">${s.text}</td></tr>`;
      }).join('');
      const gs = habitStatus(gd, ge);
      body += `<tr class="g-row"><th scope="row">${esc(g.name)}</th><td class="num">${ge}</td><td class="num">${gd}</td><td class="st ${gs.cls}">${gs.text}</td></tr>${rows}`;
    });
    const good = all.filter(x => x.s.ok), bad = all.filter(x => !x.s.ok);
    const list = arr => `<div class="chips">${arr.map(x => `<span class="chip">${esc(x.h.name)}</span>`).join('')}</div>`;
    html += `<section class="block">
      <div class="block-head"><div><span class="pill${isCur?'':' past'}">${isCur?`In progress · day ${daysPassed+1} of ${B*7}`:'Complete'}</span>
        <h2 style="margin-top:6px">Weeks ${isoWeek(bs)}–${isoWeek(addDays(bs,(B-1)*7))}</h2><p class="muted" style="margin:2px 0 0;font-size:14px">${rangeLabel(bs,B*7)}</p></div>
        <div style="text-align:right"><span class="big num">${good.length}/${all.length}</span><p class="muted" style="margin:2px 0 0;font-size:13px">on track</p></div></div>
      <div class="insights one">
        <div class="insight good"><span class="label">Going well · ${good.length}</span>${good.length ? list(good) : '<b>Nothing yet</b>'}</div>
        <div class="insight improve"><span class="label">Going badly · ${bad.length}</span>${bad.length ? list(bad) : '<b>Nothing. Great!</b>'}</div>
      </div>
      <div style="overflow-x:auto"><table class="pvd"><thead><tr><th>Habit</th><th>Expected</th><th>Done</th><th>±</th></tr></thead><tbody>${body}</tbody></table></div>
      ${isCur ? `<p class="hint" style="margin:0">Expected = what you should have done by the end of yesterday, at your weekly pace. ± = done minus expected. Today counts as soon as you mark it.</p>` : ''}
    </section>`;
  }
  return html;
}

/* ---------- 5. Render + taps ---------- */
const app = document.getElementById('app');
const nav = document.querySelector('nav');
function render(){
  nav.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', b.dataset.tab===ui.tab ? 'page' : 'false'));
  app.innerHTML = ui.tab==='review' ? renderReview() : renderWeek();
}
nav.addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if(!b) return;
  ui.tab = b.dataset.tab; ui.weekOffset = 0;
  try{ localStorage.setItem('wt-tab', ui.tab); }catch(err){}
  render(); window.scrollTo(0,0);
});
app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if(!b) return;
  switch(b.dataset.act){
    case 'toggle': toggle(b.dataset.h, b.dataset.d); return;
    case 'prev': ui.weekOffset--; break;
    case 'next': ui.weekOffset = Math.min(0, ui.weekOffset+1); break;
  }
  render();
});
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600);
}
// When you come back to the app, reload: you may have changed the sheet
document.addEventListener('visibilitychange', () => { if(!document.hidden) load(); });

render();
load();
</script>
</body>
</html>
